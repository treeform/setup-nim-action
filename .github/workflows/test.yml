name: build
on: [push, pull_request]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      # Report every platform, do not cancel the rest on the first failure.
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - ubuntu-22.04-arm
          - windows-latest
          - macos-latest
        version:
          - 2.2.12
          - 2.2.10
          - 2.2.6
    steps:
      - uses: actions/checkout@v5
      - uses: ./
        with:
          nim-version: ${{ matrix.version }}

      - name: Print Nim version
        run: nim -v
      - name: Print Nimby version
        run: nimby -v

      # Nimby installs packages as siblings of the workspace root, so the
      # workspace has to live outside this repo's checkout. Since Nimby 0.2.0
      # it refuses to create one inside a Git checkout or a Nimble package.
      - name: Create a Nimby workspace
        shell: bash
        run: |
          mkdir -p "${{ runner.temp }}/workspace"
          cd "${{ runner.temp }}/workspace"
          nimby create

      - name: Install jsony
        shell: bash
        working-directory: ${{ runner.temp }}/workspace
        run: nimby install jsony

      - name: Compile jsony
        shell: bash
        working-directory: ${{ runner.temp }}/workspace
        run: nim c jsony/src/jsony.nim
